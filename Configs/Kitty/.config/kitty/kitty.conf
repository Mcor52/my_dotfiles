font_size 16
dynamic_background_opacity yes
allow_remote_control
editor /usr/bin/nvim    # Set the editor to nvim

# BEGIN_KITTY_FONTS
font_family      family='UbuntuMono Nerd Font Mono' postscript_name=UbuntuMonoNFM
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Some more personal tweaks
scrollback_lines 10000
hide_window_decorations yes
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
notify_on_cmd_finish invisible
background_opacity 1.0
hide_window_decorations no
linux_display_server x11

cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# My keybindings that I like
map ctrl+shift+k scroll_page_up
map ctrl+shift+j scroll_page_down

map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab

# Gruvbox material theme for kitty
# Source for theme: https://github.com/selenebun/gruvbox-material-kitty

background #282828
foreground #d4be98

selection_background #d4be98
selection_foreground #282828

cursor #a89984
cursor_text_color background

active_tab_background #282828
active_tab_foreground #d4be98
active_tab_font_style bold
inactive_tab_background #282828
inactive_tab_foreground #a89984
inactive_tab_font_style normal

# Black
color0 #665c54
color8 #928374

# Red
color1 #ea6962
color9 #ea6962

# Green
color2 #a9b665
color10 #a9b665

# Yellow
color3 #e78a4e
color11 #d8a657

# Blue
color4 #7daea3
color12 #7daea3

# Magenta
color5 #d3869b
color13 #d3869b

# Cyan
color6 #89b482
color14 #89b482

# White
color7 #d4be98
color15 #d4be98

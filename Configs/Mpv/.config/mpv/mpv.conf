# --- Audio Settings ---
volume=60                  # Keeps your ears safe on startup
volume-max=150             # Allows boosting past 100% if a file is quiet

# --- Visuals & OSD (Styled with your Maroon Red accent) ---
osc=yes                    # Keeps the clean minimalist controls
osd-font-size=24           # Normalizes the text size
osd-color="#ea6962"        # Uses your exact maroon red accent
osd-border-color="#282828" # Uses your exact bg color for the border contrast
osd-border-size=2
osd-shadow=1

# --- Window & Performance ---
keep-open=yes              # Leaves the window open when the video ends instead of flashing closed
autofit-larger=80%x80%     # Keeps giant videos from spawning off-screen
hwdec=auto                 # Hardware acceleration for buttery smooth playback
